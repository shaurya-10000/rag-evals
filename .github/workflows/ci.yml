name: CI & Eval Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality-checks:
    name: Lint, Types & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # We will uncomment the pip install once we create pyproject.toml
          # pip install -e .[dev]
          pip install ruff mypy pytest
          
      - name: Lint with Ruff
        run: ruff check .
        
      - name: Check formatting with Ruff
        run: echo 'Format check skipped for now'
        
      - name: Type check with Mypy
        run: mypy src
        continue-on-error: true # Temporarily allow failure until code is added
        
      - name: Run Unit Tests
        run: pytest tests/unit
        continue-on-error: true # Temporarily allow failure until tests are added

  eval-gate:
    name: RAG Eval Regression Gate
    needs: quality-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Placeholder - Run Eval Suite
        run: |
          echo "This is where the evaluation harness will run."
          echo "It will check recall@5, faithfulness, and p95 latency against thresholds."
          echo "Currently passing as a placeholder."
