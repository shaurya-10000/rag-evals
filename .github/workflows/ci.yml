name: CI & Eval Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality-checks:
    name: Lint, Types & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint with Ruff
        run: ruff check .
      - name: Check formatting with Ruff
        run: ruff format --check . || echo "Format check skipped"
      - name: Type check with Mypy
        run: mypy src
        continue-on-error: true
      - name: Run Unit Tests
        run: pytest tests/unit

  eval-gate:
    name: RAG Eval Regression Gate
    needs: quality-checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rag_evals
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run Migrations
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/rag_evals
        run: |
          alembic upgrade head
      - name: Run Integration Tests
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/rag_evals
        run: |
          pytest tests/integration
      - name: Run Eval Suite (Gate)
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/rag_evals
        run: |
          python -m rag.eval.run_eval
